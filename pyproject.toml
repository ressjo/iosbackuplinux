[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iosbackuplinux"
version = "0.2.0"
description = "Back up, restore and browse iPhone and iPad backups over USB (based on libimobiledevice)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.5", "cryptography>=3.4"]

[project.gui-scripts]
iosbackuplinux = "iosbackup.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
iosbackup = ["resources/*.svg"]
